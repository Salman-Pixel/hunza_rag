<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hunza Trip Planner (RAG) - Chat</title>

    <!-- Tailwind (with typography for pretty Markdown) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: "#ecfdf5",
                            100: "#d1fae5",
                            200: "#a7f3d0",
                            300: "#6ee7b7",
                            400: "#34d399",
                            500: "#10b981",
                            600: "#059669",
                            700: "#047857",
                            800: "#065f46",
                            900: "#064e3b",
                        }
                    },
                    boxShadow: {
                        soft: "0 10px 30px rgba(0,0,0,0.06)",
                    }
                }
            }
        }
    </script>

    <!-- Markdown + sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <!-- React UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2750%27 fill=%27%23059669%27/%3E%3Ctext x=%2750%27 y=%2758%27 font-size=%2758%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial,Helvetica,sans-serif%27%3ER%3C/text%3E%3C/svg%3E">
    <style>
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-b from-emerald-50 via-white to-white text-gray-900">
    <div class="max-w-3xl mx-auto md:px-6 px-3 py-6">
        <!-- Sticky header -->
        <header
            class="sticky top-0 z-10 backdrop-blur supports-[backdrop-filter]:bg-white/60 bg-white/80 rounded-2xl border border-emerald-100 shadow-soft p-3 mb-4">
            <div class="flex items-center gap-3">
                <div
                    class="h-11 w-11 rounded-2xl bg-gradient-to-br from-emerald-500 to-emerald-700 text-white grid place-items-center font-extrabold shadow">
                    R
                </div>
                <div class="flex-1">
                    <h1 class="text-lg font-semibold leading-tight">Hunza Trip Planner, Local RAG</h1>
                    <p class="text-xs text-gray-600">Chat only, answers grounded in your PDFs</p>
                </div>
                <div class="hidden md:flex items-center gap-2 text-xs text-gray-500">
                    <span
                        class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-100">RAG</span>
                    <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-gray-50 border">Gemini</span>
                </div>
            </div>
        </header>

        <!-- Chat card -->
        <main class="rounded-3xl border border-gray-200 bg-white shadow-soft">
            <div id="root" class="h-[72vh] md:h-[70vh] flex flex-col"></div>
        </main>

        <footer class="mt-6 text-center text-xs text-gray-500">
            Built for Hunza travel planning. Answers may be approximate.
        </footer>
    </div>

    <script>
        const { useState, useRef, useEffect } = React;

        const md = (txt) => DOMPurify.sanitize(marked.parse(txt || ""));

        const timeNow = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

        function Avatar({ role }) {
            const isUser = role === "user";
            return React.createElement(
                "div",
                { className: "shrink-0 h-9 w-9 rounded-2xl grid place-items-center text-xs font-bold shadow " + (isUser ? "bg-emerald-600 text-white" : "bg-gray-100 text-gray-700") },
                isUser ? "You" : "RAG"
            );
        }

        function CopyBtn({ text }) {
            const [copied, setCopied] = React.useState(false);
            async function copy() {
                try {
                    await navigator.clipboard.writeText(text || "");
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1200);
                } catch { }
            }
            return React.createElement(
                "button",
                {
                    onClick: copy,
                    title: "Copy message",
                    className: "text-[11px] px-2 py-1 rounded-lg border hover:bg-gray-50 active:scale-[0.98]"
                },
                copied ? "Copied" : "Copy"
            );
        }

        function Bubble({ role, text, cites, at }) {
            const isUser = role === "user";
            return React.createElement(
                "div",
                { className: "w-full flex gap-3 " + (isUser ? "justify-end" : "justify-start") },
                !isUser && React.createElement(Avatar, { role }),
                React.createElement(
                    "div",
                    { className: "max-w-[92%] md:max-w-[65ch] " + (isUser ? "ml-auto" : "") },
                    React.createElement(
                        "div",
                        {
                            className:
                                (isUser
                                    ? "bg-gradient-to-br from-emerald-600 to-emerald-700 text-white border-emerald-600/40"
                                    : "bg-gray-50 text-gray-900 border-gray-200") +
                                " rounded-2xl px-4 py-3 shadow border"
                        },
                        React.createElement("div", {
                            className: "prose prose-sm max-w-none prose-p:my-2 prose-ul:my-2 prose-ol:my-2 " + (isUser ? "prose-invert" : ""),
                            dangerouslySetInnerHTML: { __html: md(text) },
                        }),
                        !isUser && cites && cites.length
                            ? React.createElement(
                                "div",
                                { className: "mt-2 text-[11px] text-gray-600 space-y-1" },
                                cites.map((c, i) =>
                                    React.createElement(
                                        "div",
                                        { key: i, className: "truncate" },
                                        `[${i + 1}] ${c.id || ""}, ${(c.meta?.title || "").toString().slice(0, 90)}`
                                    )
                                )
                            )
                            : null,
                        React.createElement(
                            "div",
                            { className: "mt-2 flex items-center justify-between text-[11px] " + (isUser ? "text-emerald-100" : "text-gray-500") },
                            React.createElement("span", null, at || timeNow()),
                            React.createElement(CopyBtn, { text })
                        )
                    ),
                    isUser && React.createElement(Avatar, { role })
                )
            );
        }

        function TypingDots() {
            return React.createElement(
                "div",
                { className: "flex items-center gap-2 text-gray-500 text-sm" },
                React.createElement("span", { className: "inline-block w-2 h-2 rounded-full bg-gray-300 animate-bounce [animation-delay:-0.2s]" }),
                React.createElement("span", { className: "inline-block w-2 h-2 rounded-full bg-gray-300 animate-bounce [animation-delay:-0.1s]" }),
                React.createElement("span", { className: "inline-block w-2 h-2 rounded-full bg-gray-300 animate-bounce" }),
                React.createElement("span", null, "Thinking")
            );
        }

        function ChatOnly() {
            const [messages, setMessages] = useState([
                { role: "system", text: "_Ask about Hunza trip planning. I will cite the exact PDF snippets I used._", at: timeNow() },
            ]);
            const [loading, setLoading] = useState(false);
            const inputRef = useRef(null);
            const scrollRef = useRef(null);
            const areaRef = useRef(null);
            const [canSend, setCanSend] = useState(false);

            useEffect(() => {
                const el = scrollRef.current;
                el?.lastElementChild?.scrollIntoView({ behavior: "smooth", block: "end" });
            }, [messages, loading]);

            function resizeArea() {
                const el = areaRef.current;
                if (!el) return;
                el.style.height = "0px";
                el.style.height = Math.min(el.scrollHeight, 180) + "px";
            }
            useEffect(() => { resizeArea(); }, []);
            useEffect(() => {
                const el = areaRef.current;
                if (!el) return;
                const onInput = () => { resizeArea(); setCanSend(el.value.trim().length > 0); };
                el.addEventListener("input", onInput);
                return () => el.removeEventListener("input", onInput);
            }, []);

            async function onSubmit(e) {
                e.preventDefault();
                if (loading) return;
                const q = inputRef.current.value.trim();
                if (!q) return;
                setMessages((m) => [...m, { role: "user", text: q, at: timeNow() }]);
                inputRef.current.value = "";
                resizeArea();
                setCanSend(false);
                setLoading(true);
                try {
                    const res = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: q }),
                    });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const data = await res.json();
                    setMessages((m) => [
                        ...m,
                        { role: "assistant", text: data.answer || "_No answer returned._", cites: data.citations || [], at: timeNow() }
                    ]);
                } catch (err) {
                    setMessages((m) => [...m, { role: "assistant", text: `**Error:** ${err.message || err}`, at: timeNow() }]);
                } finally {
                    setLoading(false);
                }
            }

            function onKeyDown(e) {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    if (canSend && !loading) onSubmit(e);
                }
            }

            return React.createElement(
                React.Fragment,
                null,
                React.createElement(
                    "div",
                    { ref: scrollRef, className: "flex-1 overflow-y-auto p-4 md:p-6 space-y-4" },
                    messages
                        .filter(m => m.role !== "system")
                        .map((m, i) => React.createElement(Bubble, { key: i, ...m })),
                    loading && React.createElement(TypingDots, null)
                ),
                React.createElement(
                    "form",
                    { onSubmit: onSubmit, className: "border-t border-gray-200 p-3 md:p-4" },
                    React.createElement(
                        "div",
                        { className: "flex items-end gap-2" },
                        React.createElement(
                            "div",
                            { className: "flex-1" },
                            React.createElement(
                                "div",
                                { className: "rounded-2xl border border-gray-300 bg-white focus-within:ring-2 focus-within:ring-emerald-500 px-3 py-2" },
                                React.createElement("textarea", {
                                    ref: (el) => { inputRef.current = el; areaRef.current = el; },
                                    rows: 1,
                                    placeholder: "Ask about itineraries, routes, timing, or attractions, Shift+Enter for new line",
                                    className: "w-full resize-none outline-none text-sm leading-6 placeholder:text-gray-400",
                                    onKeyDown: onKeyDown,
                                    maxLength: 2000
                                })
                            ),
                            React.createElement(
                                "div",
                                { className: "mt-1 text-[11px] text-gray-500" },
                                "Enter to send, Shift+Enter for new line"
                            )
                        ),
                        React.createElement(
                            "button",
                            {
                                className:
                                    "rounded-xl px-4 py-2 text-sm font-medium shadow " +
                                    (loading || !canSend
                                        ? "bg-gray-200 text-gray-500 cursor-not-allowed"
                                        : "bg-emerald-600 text-white hover:bg-emerald-700 active:scale-[0.99]"),
                                disabled: loading || !canSend
                            },
                            loading ? "Sending" : "Send"
                        )
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ChatOnly));
    </script>
</body>

</html>
